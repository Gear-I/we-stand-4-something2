name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      version:
        description: 'Which version of the website to publish'
        type: choice
        default: main
        options:
          - main            # current accessible design
          - classic-design  # original design copied from the Wix site

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # Version to build: the one picked in "Run workflow", otherwise the SITE_VERSION repository
      # variable (set it to classic-design to keep the old design live), otherwise this commit.
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.version || vars.SITE_VERSION || github.sha }}
      - name: Build site with Astro
        uses: withastro/action@v6
        with:
          node-version: 22
        # By default the site is built for https://<owner>.github.io/<repo>/, so it works in any
        # fork. For a custom domain, set repository variables SITE_URL (e.g. https://www.westand4something.org)
        # and BASE_PATH (/) under Settings → Secrets and variables → Actions → Variables.
        env:
          SITE_URL: ${{ vars.SITE_URL || format('https://{0}.github.io', github.repository_owner) }}
          BASE_PATH: ${{ vars.BASE_PATH || format('/{0}', github.event.repository.name) }}

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
